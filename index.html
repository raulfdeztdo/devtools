<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags (defaults, overridden dynamically per route) -->
    <title>DevToolset — Developer Tools Online</title>
    <meta name="title" content="DevToolset — Developer Tools Online" />
    <meta
      name="description"
      content="29 free developer tools in your browser: JSON validator, UUID generator, Base64 converter, regex tester, SQL formatter, JWT decoder, and much more. No registration, 100% private."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="raulfdeztdo" />

    <!-- Canonical (base — updated dynamically per route) -->
    <link rel="canonical" href="https://devtoolset.netlify.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devtoolset.netlify.app/" />
    <meta property="og:site_name" content="DevToolset" />
    <meta property="og:title" content="DevToolset — Developer Tools Online" />
    <meta
      property="og:description"
      content="29 free developer tools in your browser: JSON validator, UUID generator, Base64 converter, regex tester, SQL formatter, JWT decoder, and much more. No registration, 100% private."
    />
    <meta
      property="og:image"
      content="https://devtoolset.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://devtoolset.netlify.app/" />
    <meta name="twitter:title" content="DevToolset — Developer Tools Online" />
    <meta
      name="twitter:description"
      content="29 free developer tools in your browser: JSON validator, UUID generator, Base64 converter, regex tester, SQL formatter, JWT decoder, and much more. No registration, 100% private."
    />
    <meta
      name="twitter:image"
      content="https://devtoolset.netlify.app/og-image.png"
    />

    <!-- Hreflang -->
    <link
      rel="alternate"
      hreflang="es"
      href="https://devtoolset.netlify.app/"
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://devtoolset.netlify.app/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://devtoolset.netlify.app/"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="/fonts/inter.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
